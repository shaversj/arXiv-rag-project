services:
  postgres:
    image: pgvector/pgvector:pg15
    command:
      [
        "postgres",
        "-c",
        "log_statement=all",
        "-c",
        "log_duration=on",
        "-c",
        "log_line_prefix=%m [%p] %u@%d ",
      ]
    environment:
      POSTGRES_DB: arxiv_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
