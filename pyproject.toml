[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Claude Agent SDK library foundation for arXiv retrieval"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.0.20",
    "langfuse",
    "psycopg2-binary>=2.9.0",
    "sentence-transformers>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "numpy>=1.21",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
arxiv-rag-chat = "arxiv_rag.chat_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]
